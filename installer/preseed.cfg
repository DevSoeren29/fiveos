#### FiveOS preseed for the Debian installer (Debian 13 "trixie", amd64)
#
# This file is embedded into the installer initrd by build/build-iso.sh.
# Everything that is preseeded here is not asked during installation.
# Still asked: language, keyboard, location/timezone, user name + password,
# target disk + confirmation, and the FiveOS questions (see early.sh).

### FiveOS specific questions (FiveM, MariaDB, phpMyAdmin)
d-i preseed/early_command string sh /fiveos/early.sh
d-i preseed/late_command string sh /fiveos/late.sh

### Network
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string fiveos
d-i netcfg/get_domain string
d-i netcfg/hostname string fiveos
d-i hw-detect/load_firmware boolean true

### Mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Accounts: no root login, the created user gets sudo
d-i passwd/root-login boolean false

### Clock
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

### Partitioning: whole disk, one partition + swap.
# partman/confirm is intentionally NOT preseeded, so the user has to confirm
# before anything is written to the disk.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm_nooverwrite boolean true

### Base system: keep it small
d-i base-installer/install-recommends boolean false

### Apt
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/contrib boolean false
d-i apt-setup/services-select multiselect security, updates

### Packages: no desktop, no "standard system utilities" - only what FiveOS needs
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo ca-certificates curl wget xz-utils unzip git tmux jq whiptail ufw logrotate mariadb-server mariadb-client apache2 libapache2-mod-php php-mysql php-mbstring php-xml php-zip php-gd php-curl phpmyadmin
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# phpMyAdmin: hook into Apache, database setup is done by FiveOS on first boot
phpmyadmin phpmyadmin/reconfigure-webserver multiselect apache2
phpmyadmin phpmyadmin/dbconfig-install boolean false

### Boot loader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Finish
d-i finish-install/reboot_in_progress note
