name: Build ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: |
          shellcheck -S warning -x \
            build/build-iso.sh \
            rootfs/usr/local/bin/fiveos \
            rootfs/usr/local/lib/fiveos/firstboot.sh \
            rootfs/usr/local/lib/fiveos/lib.sh
          shellcheck -S warning -s sh \
            installer/early.sh installer/late.sh \
            rootfs/usr/local/lib/fiveos/fx-stop.sh \
            rootfs/etc/update-motd.d/10-fiveos

  iso:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y xorriso cpio wget
      - name: Build ISO
        run: bash build/build-iso.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fiveos-iso
          path: out/
          compression-level: 0

  # a tag like v0.1.0 publishes the ISO as GitHub release (used by the website)
  release:
    needs: iso
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fiveos-iso
          path: out/
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
